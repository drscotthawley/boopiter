[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "boopiter"
dynamic = ["version"]
description = "boop-iter notebook LLM workflow. cells are boops, iter-atively keeping the human in the loop"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Scott H. Hawley", email = "scott.hawley@belmont.edu"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "nbdev",
    "jupyter",
    "python-fasthtml",
    "toolslm",
    "dialoghelper",
    "uvicorn",
    "lisette",
    "httpx",
    "pytailwindcss",
    "slmn @ git+https://github.com/drscotthawley/slmn.git",
]

[project.optional-dependencies]
# The docs deploy (answerdotai/workflows/quarto-ghp3) and the test CI (nbdev3-ci) both hardcode
# `pip install -e ".[dev]"`, so the llms.txt build tools -- used by the _quarto.yml pre/post-render
# hooks (pysym2md -> apilist.txt, llms-txt's llms_txt2ctx -> llms-ctx*.txt) -- must live here.
dev = ["pysym2md", "llms-txt"]

[project.urls]
Repository = "https://github.com/drscotthawley/boopiter"
Documentation = "https://drscotthawley.github.io/boopiter/"

[project.entry-points.nbdev]
boopiter = "boopiter._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "boopiter.__version__"}

[tool.setuptools.packages.find]
include = ["boopiter"]

[project.scripts]
boopiter = "boopiter.core:launch"

[tool.nbdev]
# Prompt/reply structure now lives in cell SOURCE (solveit separator), so boopiter no longer
# depends on any metadata surviving nbdev-clean. We still stamp `solveit_ai:true` on prompt/reply
# cells for solveit interop and register it here so nbdev-clean preserves it -- but losing it would
# not break boopiter's own loading. See nbs/04_serialize.ipynb.
allowed_cell_metadata_keys = ["solveit_ai"]
